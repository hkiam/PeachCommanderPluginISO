name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { path: PeachCommanderPluginISO }

      # The tag, the manifest and the package name are three places one version is written. They
      # are checked against each other here rather than after somebody downloads the wrong one.
      - name: The tag matches PCPluginVersion
        working-directory: PeachCommanderPluginISO
        run: |
          DECLARED=$(/usr/libexec/PlistBuddy -c "Print :PCPluginVersion" Plugin/Info.plist)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$DECLARED" != "$TAG" ]; then
            echo "tag $GITHUB_REF_NAME says $TAG but Plugin/Info.plist says $DECLARED" >&2
            exit 1
          fi
          echo "version $DECLARED"

      - name: Test
        working-directory: PeachCommanderPluginISO
        run: swift test

      - name: Build the package
        working-directory: PeachCommanderPluginISO
        run: ./build.sh dist --package

      - name: Conformance
        working-directory: PeachCommanderPluginISO
        run: |
          swift run --package-path .build/checkouts/PeachCommanderPluginSDK \
            pcplug-validate "$(ls dist/*.pcplug)"

      # A .zip beside the .pcplug, byte-for-byte the same package under a name older hosts accept.
      # Peach Commander before 0.9.0 does not know the .pcplug extension: its install chooser filters
      # on public.zip-archive, an undeclared type does not conform to it, and a double-click reaches
      # nothing. Telling those users to rename a download is a worse answer than shipping both.
      - name: A .zip for hosts that do not know the extension yet
        working-directory: PeachCommanderPluginISO
        run: |
          for pkg in dist/*.pcplug; do cp "$pkg" "dist/$(basename "${pkg%.pcplug}").zip"; done
          ls -l dist/

      - name: Publish
        working-directory: PeachCommanderPluginISO
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.pcplug dist/*.zip \
            --title "ISO / UDF Disc Images $GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
